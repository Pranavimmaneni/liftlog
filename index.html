<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LiftLog</title>
    <meta name="description" content="Workout logbook that plans every set. Works offline, no account." />
    <meta name="theme-color" content="#F2EADB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2EADB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiftLog" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script src="/theme-boot.js"></script>
    <style>
      /* Boot splash painted before the JS arrives (NFR-PERF-1); React replaces #root's content. */
      html {
        background: #f2eadb;
        color: #1d1b18;
      }
      html[data-theme='iron'] {
        background: #151412;
        color: #efe6d4;
      }
      /* Rising Sun look (FR-DSN-1): workout light and dark, then food light and dark. */
      html[data-design='sun'] {
        background: #f3f1ea;
        color: #0d0d0c;
      }
      html[data-design='sun'][data-theme='iron'] {
        background: #0b0b0a;
        color: #f3f1ea;
      }
      html[data-design='sun'][data-section='food'] {
        background: #e6ede3;
        color: #12201a;
      }
      html[data-design='sun'][data-section='food'][data-theme='iron'] {
        background: #12201a;
        color: #eef2e8;
      }
      .ll-boot {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          900 44px/1 'Big Shoulders Display',
          Oswald,
          'Arial Narrow',
          sans-serif;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="ll-boot" aria-hidden="true">LIFTLOG</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
