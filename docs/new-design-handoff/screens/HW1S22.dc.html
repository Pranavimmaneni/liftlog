body{margin:0}
.t{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F3F1EA;color:#0D0D0C;font-family:'Hanken Grotesk',sans-serif;font-size:16px;display:flex;flex-direction:column;padding:56px 20px 0}
.t > *{position:relative}
.t a{color:inherit;text-decoration:none}
.dim{color:#45453F}
.rowx{display:flex;justify-content:space-between;align-items:center}
.sp{flex:1}
.bd{font-family:'Dela Gothic One',sans-serif;font-weight:400;letter-spacing:-.03em;line-height:.95;font-variant-numeric:lining-nums}
.gl{background:rgba(250,249,244,.8);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(13,15,10,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.card{background:#FBFAF5;border:1.5px solid #0D0D0C;border-radius:14px;overflow:hidden}
.seg{display:grid;grid-template-columns:1fr 1fr;height:44px;border-radius:22px;padding:3px;box-sizing:border-box;font-weight:600;font-size:15px;margin-top:12px}
.seg a{display:flex;align-items:center;justify-content:center;border-radius:19px}
.t .seg a.on{background:#0D0D0C;color:#F3F1EA}
.t .btn{display:flex;align-items:center;justify-content:center;height:58px;border:1.5px solid #0D0D0C;border-radius:14px;background:#E5382A;color:#0D0D0C;font-family:inherit;font-weight:700;font-size:17px;width:100%;box-sizing:border-box}
.li{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px}
.li + .li{border-top:1px solid #D9D6CB}
.li small{display:block;font-size:13px;color:#45453F}
.bar{height:6px;border-radius:3px;background:rgba(13,13,12,.07);overflow:hidden}
.bar i{display:block;height:6px}
.tabs{position:absolute !important;left:20px;right:20px;bottom:22px;height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;font-weight:600}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#45453F}
.t .tabs a.on{color:#0D0D0C}
.t .tabs a.on svg{color:#D8321F}
.st{width:56px;height:56px;border:1px solid rgba(13,15,10,.16);border-radius:14px;background:rgba(13,13,12,.07);color:#0D0D0C;font:500 26px 'Hanken Grotesk',sans-serif;flex:none}
.chip{border-radius:16px;padding:8px 12px;font-size:13px}
.chip b{display:block;font-size:15px}
.sf{stroke:#0D0D0C}.ff{fill:#0D0D0C}.sh{stroke:#FBFAF5}.fh{fill:#FBFAF5}.sl{stroke:#45453F}.se,.sd{stroke:#45453F}.fe,.fd{fill:#45453F}.sg{stroke:#D9D6CB}.fg{fill:#D9D6CB}.sa{stroke:#D8321F}.fa{fill:#D8321F}
</style>
