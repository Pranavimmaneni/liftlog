<!doctype html><html lang="en" data-theme="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiftLog F07 Fasting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="food.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')==='iron'?'iron':'paper'</script>
</head><body>
<div class="phone">

<header class="top" style="justify-content:flex-start">
  <button type="button" class="icon" aria-label="Back" style="margin-left:-12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="grow"><div class="title">Fasting</div><div class="sm muted gap8">16:8 · since 8:00 pm · 4 in a row</div></div>
</header>

<main class="body">
  <!-- Ring: 14 h 20 m of 16 h (circumference 2π·120 ≈ 754; 0.896 done) -->
  <div class="gap40" style="position:relative;width:272px;height:272px;margin-left:auto;margin-right:auto">
    <svg width="272" height="272" viewBox="0 0 272 272" aria-hidden="true">
      <circle cx="136" cy="136" r="120" fill="none" stroke="var(--ll-rule)" stroke-width="10"/>
      <circle cx="136" cy="136" r="120" fill="none" stroke="var(--ll-ink)" stroke-width="10" stroke-dasharray="676 754" transform="rotate(-90 136 136)"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="big" style="font-size:72px">14:20</div>
      <div class="sm muted gap8">1 h 40 m left</div>
    </div>
  </div>
  <div class="sm gap24" style="text-align:center">Eat from <span class="mono">12:00 pm</span></div>

  <div class="label gap40">This week</div>
  <div class="gap16" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center">
    <div><div class="bar thick"><i class="on"></i></div><div class="label gap8">M</div></div>
    <div><div class="bar thick"><i class="on"></i></div><div class="label gap8">T</div></div>
    <div><div class="bar thick"><i class="on"></i></div><div class="label gap8">W</div></div>
    <div><div class="bar thick"><i class="on"></i></div><div class="label gap8">T</div></div>
    <div><div class="bar thick"><i class="hot"></i></div><div class="label gap8 accent">F</div></div>
    <div><div class="bar thick"><i></i></div><div class="label gap8">S</div></div>
    <div><div class="bar thick"><i></i></div><div class="label gap8">S</div></div>
  </div>
  <div class="between gap32"><span class="sm muted">Upper B at 6:30 pm is in your eating window.</span></div>
  <div class="gap16"><span class="link">Change plan</span></div>
</main>

<div class="dock low"><button type="button" class="cta">End fast</button></div>
</div>
</body></html>
