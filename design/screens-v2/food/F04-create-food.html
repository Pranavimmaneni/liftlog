<!doctype html><html lang="en" data-theme="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiftLog F04 Create food</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="food.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')==='iron'?'iron':'paper'</script>
</head><body>
<div class="phone">

<header class="top" style="justify-content:flex-start">
  <button type="button" class="icon" aria-label="Back" style="margin-left:-12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="grow"><div class="title">New food</div></div>
</header>

<main class="body">
  <div class="tabs gap16"><span class="on">Food</span><span>Recipe</span><span>Quick add</span></div>

  <div class="gap16">
    <div class="field"><span class="muted">Name</span><span>Mom's rajma chawal</span></div>
    <div class="field"><span class="muted">Serving</span><span class="v">1 plate · 320 g</span></div>
    <div class="field"><span class="muted">Barcode</span><span class="link">Scan</span></div>
  </div>

  <div class="label gap32">Per serving</div>
  <div class="gap8">
    <div class="field"><span>Calories</span><span class="v">520 kcal</span></div>
    <div class="field"><span>Protein</span><span class="v">18 g</span></div>
    <div class="field"><span>Carbs</span><span class="v">86 g</span></div>
    <div class="field"><span>Fat</span><span class="v">11 g</span></div>
  </div>
  <div class="gap16"><span class="link">Add more nutrients</span></div>
</main>

<div class="dock low"><button type="button" class="cta">Save food</button></div>
</div>
</body></html>
