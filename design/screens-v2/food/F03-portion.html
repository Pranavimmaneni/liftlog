<!doctype html><html lang="en" data-theme="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiftLog F03 Portion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="food.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')==='iron'?'iron':'paper'</script>
</head><body>
<div class="phone">
<!-- F02 stays behind; the portion sheet slides up -->
<header class="top" style="justify-content:flex-start"><span class="icon"></span><div class="title">Add to dinner</div></header>
<div class="scrim"></div>
<div class="sheet">
  <div class="grabber"></div>
  <div class="title">Paneer bhurji</div>
  <div class="sm muted gap8">Indian dish · 1 katori is 150 g</div>

  <div class="choice gap24"><span class="on">Katori</span><span>Plate</span><span>Grams</span></div>

  <div class="stepper gap24">
    <button type="button" aria-label="Less">−</button>
    <div style="text-align:center"><div class="big" style="font-size:56px">1</div><div class="label gap8">katori</div></div>
    <button type="button" aria-label="More">+</button>
  </div>

  <div class="gap32" style="text-align:center"><span class="big" style="font-size:40px">290</span><span class="mono muted sm"> kcal</span></div>
  <div class="cols3 gap16" style="text-align:center">
    <div><div class="mono">18 g</div><div class="label gap8">Protein</div></div>
    <div><div class="mono">9 g</div><div class="label gap8">Carbs</div></div>
    <div><div class="mono">21 g</div><div class="label gap8">Fat</div></div>
  </div>

  <div class="between gap32 sm"><span>Protein after this</span><span class="mono">82<span class="muted">/140 g</span></span></div>
  <div class="bar gap8"><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="gold"></i><i></i><i></i><i></i><i></i></div>

  <div class="gap32"><button type="button" class="cta">Add to dinner</button></div>
</div>
</div>
</body></html>
